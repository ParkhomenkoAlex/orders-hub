services:
    mysql-test:
        image: mysql:8.4
        container_name: orders-hub-mysql-test
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: orders_hub_test
            MYSQL_USER: orders_hub_test_app
            MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD}
        ports:
            - "127.0.0.1:${MYSQL_TEST_HOST_PORT:-3308}:3306"
        volumes:
            - mysql_test_data:/var/lib/mysql
        command:
            - --default-storage-engine=InnoDB
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

volumes:
    mysql_test_data:
